<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GoVia - Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0B1F3A; --navy-2:#12294A;
    --green:#22C55E; --green-d:#16A34A; --green-l:#4ADE80;
    --bg:#F8FAFC; --white:#fff; --slate:#64748B; --slate-2:#94A3B8;
    --line:#E5EAF1; --field:#F1F5F9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1000px 600px at 15% -5%, #EAF7EF 0%, transparent 55%),
      radial-gradient(900px 600px at 100% 0%, #EEF3FA 0%, transparent 50%),
      var(--bg);
    color:var(--navy); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:32px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .brandfont{font-family:'Plus Jakarta Sans',sans-serif;}

  /* Phone frame */
  .phone{
    width:390px; min-height:820px; background:var(--white);
    border-radius:44px; position:relative; overflow:hidden;
    box-shadow:0 40px 80px -24px rgba(11,31,58,.28), 0 0 0 10px #0B1F3A, 0 0 0 11px #1e3350;
  }
  .statusbar{
    height:52px; display:flex; align-items:center; justify-content:space-between;
    padding:0 30px; font-family:'Plus Jakarta Sans'; font-weight:700; font-size:15px; color:var(--navy);
  }
  .statusbar .icons{display:flex; gap:7px; align-items:center;}
  .notch{position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:28px; background:var(--navy); border-radius:16px;}

  .screen{padding:8px 26px 30px;}

  /* Logo */
  .logo{display:flex; flex-direction:column; align-items:center; gap:14px; margin:14px 0 8px;}
  .logo .word{font-family:'Plus Jakarta Sans'; font-weight:800; font-size:30px; letter-spacing:-1.2px;}
  .logo .word .g{color:var(--navy);} .logo .word .v{color:var(--green);}

  .head{text-align:center; margin:18px 0 22px;}
  .head h1{font-family:'Plus Jakarta Sans'; font-weight:800; font-size:26px; letter-spacing:-.6px; margin-bottom:6px;}
  .head p{color:var(--slate); font-size:14.5px; line-height:1.5;}

  /* Segmented toggle */
  .seg{display:flex; background:var(--field); border-radius:16px; padding:5px; margin-bottom:26px;}
  .seg button{
    flex:1; border:0; background:transparent; cursor:pointer;
    font-family:'Plus Jakarta Sans'; font-weight:700; font-size:15px; color:var(--slate);
    padding:11px 0; border-radius:12px; transition:.18s;
  }
  .seg button.active{background:var(--white); color:var(--navy); box-shadow:0 2px 8px rgba(11,31,58,.08);}

  /* Fields */
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:'Plus Jakarta Sans'; font-weight:600; font-size:13px; color:var(--navy); margin-bottom:8px;}
  .inp{
    display:flex; align-items:center; gap:10px; background:var(--field);
    border:1.5px solid transparent; border-radius:14px; padding:0 14px; height:54px; transition:.15s;
  }
  .inp:focus-within{border-color:var(--green); background:var(--white); box-shadow:0 0 0 4px rgba(34,197,94,.12);}
  .inp svg{flex:none;}
  .inp input{border:0; outline:0; background:transparent; width:100%; font-family:'Inter'; font-size:15.5px; color:var(--navy); font-weight:500;}
  .inp input::placeholder{color:var(--slate-2); font-weight:400;}
  .phonepx{display:flex; align-items:center; gap:7px; padding-right:12px; margin-right:2px; border-right:1.5px solid var(--line); height:26px; font-weight:600; font-size:15px; color:var(--navy);}
  .flag{width:22px; height:16px; border-radius:3px; overflow:hidden; display:block;}

  /* Button */
  .cta{
    width:100%; border:0; cursor:pointer; margin-top:8px;
    background:linear-gradient(180deg, #26CD61, #16A34A);
    color:#fff; font-family:'Plus Jakarta Sans'; font-weight:800; font-size:16.5px;
    height:56px; border-radius:16px; letter-spacing:.2px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    box-shadow:0 12px 22px -8px rgba(22,163,74,.55);
    transition:.15s;
  }
  .cta:active{transform:translateY(1px);}

  .divider{display:flex; align-items:center; gap:14px; color:var(--slate-2); font-size:12.5px; margin:22px 0; font-weight:500;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}

  .ghost{
    width:100%; height:54px; border-radius:14px; border:1.5px solid var(--line);
    background:#fff; cursor:pointer; font-family:'Plus Jakarta Sans'; font-weight:700; font-size:15px; color:var(--navy);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }

  .foot{text-align:center; font-size:12.5px; color:var(--slate); margin-top:22px; line-height:1.6;}
  .foot a{color:var(--green-d); font-weight:600; text-decoration:none;}

  .hidden{display:none !important;}
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#0B1F3A"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 3.2c2.1 0 4 .8 5.4 2.1l1.4-1.5C13.5 2 11.1 1 8.5 1S3.5 2 1.7 3.8l1.4 1.5C4.5 4 6.4 3.2 8.5 3.2z" fill="#0B1F3A"/><path d="M8.5 6.4c1.2 0 2.3.5 3.1 1.3L8.5 11 5.4 7.7c.8-.8 1.9-1.3 3.1-1.3z" fill="#0B1F3A"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" fill="none" stroke="#0B1F3A" stroke-opacity=".5"/><rect x="3" y="3" width="17" height="7" rx="1.5" fill="#0B1F3A"/><rect x="23" y="4" width="2" height="5" rx="1" fill="#0B1F3A" fill-opacity=".5"/></svg>
      </span>
    </div>

    <div class="screen">
      <!-- Logo -->
      <div class="logo">
        <svg width="52" height="52" viewBox="0 0 120 120" aria-label="GoVia">
          <defs><linearGradient id="a-mark" x1="28" y1="90" x2="96" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#22C55E"/></linearGradient></defs>
          <path d="M30 42 L55 86 L90 26" fill="none" stroke="url(#a-mark)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M72 26 L90 26 L90 44" fill="none" stroke="url(#a-mark)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="30" cy="42" r="6" fill="#fff" stroke="#22C55E" stroke-width="5"/>
        </svg>
        <div class="word"><span class="g">Go</span><span class="v">Via</span></div>
      </div>

      <div class="head">
        <h1 id="h-title">Create your account</h1>
        <p id="h-sub">Compare every carrier and ship smarter,<br>all from one place.</p>
      </div>

      <!-- Toggle -->
      <div class="seg">
        <button id="tab-login" onclick="setMode('login')">Log in</button>
        <button id="tab-signup" class="active" onclick="setMode('signup')">Sign up</button>
      </div>

      <!-- Full name (signup only) -->
      <div class="field" id="f-name">
        <label>Full name</label>
        <div class="inp">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="#94A3B8" stroke-width="1.8"/><path d="M5 19c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="text" placeholder="Ahmed Hassan" autocomplete="name"/>
        </div>
      </div>

      <!-- Phone -->
      <div class="field" id="f-phone">
        <label>Phone number</label>
        <div class="inp">
          <span class="phonepx">
            <span class="flag"><svg width="22" height="16" viewBox="0 0 22 16"><rect width="22" height="5.33" y="0" fill="#CE1126"/><rect width="22" height="5.33" y="5.33" fill="#fff"/><rect width="22" height="5.34" y="10.66" fill="#000"/><path d="M11 6.2l.6 1.2 1.3.1-1 .9.3 1.3-1.2-.7-1.2.7.3-1.3-1-.9 1.3-.1z" fill="#C09300"/></svg></span>
            +20
          </span>
          <input type="tel" placeholder="10 1234 5678" autocomplete="tel"/>
        </div>
      </div>

      <!-- Email (signup only) -->
      <div class="field" id="f-email">
        <label>Email address</label>
        <div class="inp">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="#94A3B8" stroke-width="1.8"/><path d="M4 7l8 6 8-6" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="email" placeholder="you@store.com" autocomplete="email"/>
        </div>
      </div>

      <button class="cta" id="cta">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6z" opacity=".95"/><circle cx="18.5" cy="17.5" r="2"/><circle cx="5.5" cy="16.5" r="1.4"/></svg>
        <span id="cta-label">Create account</span>
      </button>

      <div class="divider">or continue with</div>
      <button class="ghost">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.2c-.3 1.4-1.1 2.6-2.3 3.4v2.8h3.7C21.7 18.6 23 15.8 23 12.3z"/><path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.8c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.8H1.8v2.9C3.7 21.4 7.5 24 12 24z"/><path fill="#FBBC05" d="M5.6 14.7c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2V7.4H1.8C1 8.9.6 10.4.6 12.5s.4 3.6 1.2 5.1l3.8-2.9z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.2 15.1 0 12 0 7.5 0 3.7 2.6 1.8 6.4l3.8 2.9C6.5 6.8 9 4.8 12 4.8z"/></svg>
        Google
      </button>

      <p class="foot" id="foot">By continuing you agree to GoVia's<br><a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
    </div>
  </div>

<script>
  function setMode(mode){
    var signup = mode === 'signup';
    document.getElementById('tab-signup').classList.toggle('active', signup);
    document.getElementById('tab-login').classList.toggle('active', !signup);
    document.getElementById('f-name').classList.toggle('hidden', !signup);
    document.getElementById('f-email').classList.toggle('hidden', !signup);
    document.getElementById('h-title').textContent = signup ? 'Create your account' : 'Welcome back';
    document.getElementById('h-sub').innerHTML = signup
      ? 'Compare every carrier and ship smarter,<br>all from one place.'
      : 'Log in to manage and track all your<br>shipments in one place.';
    document.getElementById('cta-label').textContent = signup ? 'Create account' : 'Continue';
    document.getElementById('foot').style.display = signup ? '' : 'none';
  }
  var params = new URLSearchParams(location.search);
  setMode(params.get('mode') === 'login' ? 'login' : 'signup');
</script>
</body>
</html>
