<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GoVia app icon, light">
  <title>GoVia - app icon (light)</title>
  <defs>
    <linearGradient id="gv-iconl-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="gv-iconl-route" x1="150" y1="360" x2="380" y2="150" gradientUnits="userSpaceOnUse">
