<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" role="img" aria-label="GoVia horizontal logo on light background">
  <title>GoVia - horizontal logo (light background)</title>
  <defs>
    <linearGradient id="gv-h-route" x1="28" y1="86" x2="94" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16A34A"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
    .gv-word { font-family: 'Plus Jakarta Sans', 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 82px; letter-spacing: -3px; }
  </style>

  <!-- Symbol -->
  <g transform="translate(6 10)">
    <path d="M30 40 L57 84 L92 28" fill="none" stroke="url(#gv-h-route)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="40" r="6" fill="#F8FAFC" stroke="#22C55E" stroke-width="5"/>
    <circle cx="92" cy="28" r="12" fill="#0B1F3A"/>
    <circle cx="92" cy="28" r="4.4" fill="#22C55E"/>
  </g>

  <!-- Wordmark -->
  <text class="gv-word" x="150" y="94">
    <tspan fill="#0B1F3A">Go</tspan><tspan fill="#22C55E">Via</tspan>
  </text>
</svg>
